name: Fetch DoCode Usage
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch data from DoCode
        env:
          DOCODE_TOKEN: ${{ secrets.DOCODE_TOKEN }}
          DOCODE_USER_ID: ${{ secrets.DOCODE_USER_ID }}
        run: python fetch_data.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "update usage data $(date -u +%Y-%m-%dT%H:%M:%SZ)" && git push
